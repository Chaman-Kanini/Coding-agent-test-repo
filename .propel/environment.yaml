stack: node-playwright
install_cmd: npm install
syntax_cmd: find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.mjs'
  -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check
build_cmd: npm run build --if-present
test_cmd: PLAYWRIGHT_JUNIT_OUTPUT_NAME=.propel/junit.xml npx playwright test --reporter=junit;
  status=$?; cat .propel/junit.xml; exit $status
test_selector: PLAYWRIGHT_JUNIT_OUTPUT_NAME=.propel/junit.xml npx playwright test
  --reporter=junit {path}; status=$?; cat .propel/junit.xml; exit $status
dependency_file: package.json
