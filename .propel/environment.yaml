stack: node-playwright
runtime_version: "1.47"
install_cmd: npm install
syntax_cmd: find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check
build_cmd: npm run build
test_cmd: PLAYWRIGHT_JUNIT_OUTPUT_NAME=.propel/junit.xml npx playwright test --reporter=junit; cat .propel/junit.xml
test_selector: PLAYWRIGHT_JUNIT_OUTPUT_NAME=.propel/junit.xml npx playwright test --reporter=junit {path}; cat .propel/junit.xml
dependency_file: package.json