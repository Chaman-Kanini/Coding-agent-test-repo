components:
    schemas:
        Cart:
            properties:
                customerId:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - customerId
            type: object
        CartInput:
            properties:
                customerId:
                    format: uuid
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - customerId
            type: object
        Customer:
            properties:
                email:
                    type: string
                fullName:
                    type: string
                id:
                    format: uuid
                    type: string
                phone:
                    type: string
            required:
                - id
                - fullName
                - email
            type: object
        CustomerInput:
            properties:
                email:
                    type: string
                fullName:
                    type: string
                phone:
                    type: string
            required:
                - fullName
                - email
            type: object
        Order:
            properties:
                customerId:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
                placedAt:
                    format: date-time
                    type: string
                status:
                    type: string
                total:
                    type: number
            required:
                - id
                - customerId
                - status
            type: object
        OrderInput:
            properties:
                customerId:
                    format: uuid
                    type: string
                placedAt:
                    format: date-time
                    type: string
                status:
                    type: string
                total:
                    type: number
            required:
                - customerId
                - status
            type: object
        OrderItem:
            properties:
                id:
                    format: uuid
                    type: string
                orderId:
                    format: uuid
                    type: string
                productId:
                    format: uuid
                    type: string
                quantity:
                    type: integer
                unitPrice:
                    type: number
            required:
                - id
                - orderId
                - productId
                - quantity
            type: object
        OrderItemInput:
            properties:
                orderId:
                    format: uuid
                    type: string
                productId:
                    format: uuid
                    type: string
                quantity:
                    type: integer
                unitPrice:
                    type: number
            required:
                - orderId
                - productId
                - quantity
            type: object
        Product:
            properties:
                description:
                    type: string
                id:
                    format: uuid
                    type: string
                name:
                    type: string
                price:
                    type: number
                sku:
                    type: string
                stock:
                    type: integer
            required:
                - id
                - name
                - sku
                - price
            type: object
        ProductInput:
            properties:
                description:
                    type: string
                name:
                    type: string
                price:
                    type: number
                sku:
                    type: string
                stock:
                    type: integer
            required:
                - name
                - sku
                - price
            type: object
info:
    title: ECommercePlatform API
    version: 0.1.0
openapi: 3.0.3
paths:
    /api/carts:
        get:
            operationId: ListCarts
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/Cart'
                                type: array
                    description: OK
            summary: List carts
        post:
            operationId: CreateCart
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CartInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cart'
                    description: OK
            summary: Create cart
    /api/carts/{id}:
        delete:
            operationId: DeleteCart
            responses:
                "204":
                    description: Deleted
        get:
            operationId: GetCart
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cart'
                    description: OK
            summary: Get one cart
        parameters:
            - in: path
              name: id
              required: true
              schema:
                format: uuid
                type: string
        put:
            operationId: UpdateCart
            requestBody:
                content:
                    application/json:
                        schema:
